name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Verify / ${{ matrix.os }} / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Release metadata and documentation
        run: |
          python3 scripts/check_release.py
          python3 scripts/test_release.py
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Desktop offline checks
        run: bash desktop/test.sh
      - name: Verify source archives
        run: python3 scripts/package_release.py
