[package]
name = "Nautilus-Agent"
version = "0.0.1-alpha.2"
edition = "2024"
default-run = "Nautilus-Agent"
description = "Nautilus text chat prototype with Rust and a Java desktop client"
readme = "README.md"
repository = "https://github.com/FrancisGray-Chou/Nautilus-Agent"
publish = false

[lib]
name = "nautilus_agent"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["full"] }
async-openai = "0.23.0"
dotenvy = "0.15.7"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
